<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Utforska en stilla vinternatt genom att besöka puben, bastun, växthuset och gästhuset."
    />
    <title>Hästgården i Teda</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">En plats på jorden</p>
          <h1>Hästgården i Teda</h1>
        </div>
        <p class="instruction">Välj en plats att utforska</p>
      </header>

      <section class="map-frame" aria-label="Interaktiv karta över gården">
        <img class="map-image" src="assets/base_image.jpg" alt="En snötäckt gård under norrskenet" />
        <div class="map-vignette" aria-hidden="true"></div>

        <div class="hotspots" aria-label="Platser att besöka">
          <button class="hotspot hotspot--pub" data-place="pub" type="button">
            <span class="hotspot-ring" aria-hidden="true"></span>
            <span class="hotspot-dot" aria-hidden="true"></span>
            <span class="hotspot-label">Puben</span>
          </button>
          <button class="hotspot hotspot--greenhouse" data-place="greenhouse" type="button">
            <span class="hotspot-ring" aria-hidden="true"></span>
            <span class="hotspot-dot" aria-hidden="true"></span>
            <span class="hotspot-label">Växthuset</span>
          </button>
          <button class="hotspot hotspot--sauna" data-place="sauna" type="button">
            <span class="hotspot-ring" aria-hidden="true"></span>
            <span class="hotspot-dot" aria-hidden="true"></span>
            <span class="hotspot-label">Bastun</span>
          </button>
          <button class="hotspot hotspot--guest-house" data-place="guest-house" type="button">
            <span class="hotspot-ring" aria-hidden="true"></span>
            <span class="hotspot-dot" aria-hidden="true"></span>
            <span class="hotspot-label">Gästhuset</span>
          </button>
        </div>
      </section>

    </main>

    <div class="modal-backdrop" id="place-modal" hidden>
      <section class="place-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <button class="close-button" type="button" aria-label="Stäng platsinformation">×</button>
        <div class="dialog-image-wrap">
          <img class="dialog-image" id="dialog-image" src="" alt="" />
          <button class="dialog-hotspot" id="bar-hotspot" type="button" aria-label="Utforska baren">
            <span class="hotspot-ring" aria-hidden="true"></span>
            <span class="hotspot-dot" aria-hidden="true"></span>
            <span class="hotspot-label">Baren</span>
          </button>
        </div>
        <div class="dialog-content">
          <p class="eyebrow" id="dialog-kicker">En plats att utforska</p>
          <h2 id="dialog-title"></h2>
          <p id="dialog-description"></p>
          <button class="continue-button" type="button">Tillbaka till kartan</button>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
